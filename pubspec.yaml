name: smart_scanner_pdf
description: "A professional document scanner and PDF maker application for Android and iOS."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Camera & Hardware
  camera: ^0.11.0+2

  # Google ML Kit for Document Text Recognition
  google_mlkit_text_recognition: ^0.14.0

  # PDF Generation & Printing
  pdf: ^3.11.1
  printing: ^5.13.2

  # Image Processing & Cropping
  image: ^4.3.0
  image_picker: ^1.1.2

  # Storage & File System
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  open_filex: ^4.5.0
  share_plus: ^10.1.2

  # UI & Animations
  flutter_spinkit: ^5.2.1
  signature: ^5.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
